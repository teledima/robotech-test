services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    ports:
      - "8080:80"
    depends_on:
      - api
      - camera
    networks:
      - my_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    ports:
      - "8000:8000"
    volumes:
      - ./data/sqlite/excercise.db:/app/data/sqlite/excercise.db
    networks:
      - my_network

  camera:
    build:
      context: .
      dockerfile: Dockerfile.camera
    container_name: camera
    environment:
      - TCP_HOST=checker
      - WS_HOST=0.0.0.0
      - IMAGE_FOLDER=/app/data/images
      - MINIO_ENDPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq
      - API_HOST=api
      - API_PORT=8000
    ports:
      - "${WS_PORT:-1234}:${WS_PORT:-1234}"
    depends_on:
      - checker
      - minio
      - rabbitmq
      - api
    networks:
      - my_network

  checker:
    build:
      context: .
      dockerfile: Dockerfile.checker
    container_name: checker
    environment:
      - TCP_HOST=0.0.0.0
      - WS_HOST=camera
    ports:
      - "${TCP_PORT:-4096}:${TCP_PORT:-4096}"
    depends_on:
      - rabbitmq
      - minio
    networks:
      - my_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rmq_data:/var/lib/rabbitmq
    command: bash -c "
        rabbitmq-server &
        sleep 10 &&
        rabbitmqadmin -u ${RABBITMQ_DEFAULT_USER:-guest} -p ${RABBITMQ_DEFAULT_PASS:-guest} -H rabbitmq declare exchange name=inference.in type=direct &&
        rabbitmqadmin -u ${RABBITMQ_DEFAULT_USER:-guest} -p ${RABBITMQ_DEFAULT_PASS:-guest} -H rabbitmq declare queue name=inference.in durable=true &&
        rabbitmqadmin -u ${RABBITMQ_DEFAULT_USER:-guest} -p ${RABBITMQ_DEFAULT_PASS:-guest} -H rabbitmq declare binding source=inference.in destination=inference.in routing_key=inference.in &&
        wait"
    networks:
      - my_network

  minio:
    platform: linux/x86_64
    image: quay.io/minio/aistor/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - min_data:/mnt/data
      - ./minio.license:/minio.license
    command: minio server /mnt/data --license /minio.license
    restart: always
    networks:
      - my_network

  mc:
    build:
      context: .
      dockerfile: Dockerfile.mc
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done &&
        mc mb myminio/images &&
        mc anonymous set public myminio/images
      "
    restart: "no"
    networks:
      - my_network
  
volumes:
  min_data:
  rmq_data:

networks:
  my_network:
    driver: bridge